[build]
  # Base directory: frontend folder
  base = "frontend"
  
  # Build command: Install Flutter SDK and build
  # Install Flutter, accept licenses, get dependencies, then build
  command = "git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter && export PATH=\"$HOME/flutter/bin:$PATH\" && flutter --version && flutter pub get && flutter build web --release"
  
  # Publish directory: Relative to base directory
  publish = "build/web"

[build.environment]
  # Flutter SDK version (adjust if needed)
  FLUTTER_VERSION = "3.9.2"

# Redirect all routes to index.html for Flutter web routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
