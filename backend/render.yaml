services:
  - type: web
    name: hi-campus-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      # Database variables - Render sẽ tự động tạo DATABASE_URL cho PostgreSQL
      # Code sẽ tự động sử dụng DATABASE_URL nếu có

databases:
  - name: hi-campus-db
    plan: free
    databaseName: hi_campus
    user: hi_campus_user
    # PostgreSQL là default database type trên Render

