services:
  - type: web
    name: hi-campus-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      # Database variables - sẽ được set trong Render Dashboard
      # DB_USER, DB_PASS, DB_HOST, DB_NAME, DB_PORT
      # hoặc DATABASE_URL nếu dùng Render managed database

databases:
  - name: hi-campus-db
    plan: free
    databaseName: hi_campus
    user: hi_campus_user

